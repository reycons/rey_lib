# App: rey_lib
# Purpose: Repository-map scan rules — inventory pruning, language mapping, file classification.
# Used-by: rey_lib.repository_map
#
# Shared application-neutral framework.
# Hidden entries are excluded by the scanner itself and are not listed here.
#
# This repository declares no architecture policy, so its generated map reports
# architecture_policy_status: not_configured. That is not the same as clean.

ignored_directory_names:
  - node_modules
  - __pycache__
  - build
  - dist
  - venv

ignored_path_globs:
  - "*.egg-info/*"
  - "*.zip"
  - "*.log"
  - "*.jsonl"

language_by_extension:
  ".py": Python
  ".yaml": YAML
  ".yml": YAML

generated_path_globs: []

vendor_path_globs: []

test_path_globs:
  - "tests/*"
  - "*/tests/*"
  - "test_*.py"
  - "*/test_*.py"

# Declared process entry points. This file is their owner: they are a
# repository-local declaration, not a copy of anything. Not added to make
# reachability look healthy.
runtime_entry_paths:
  - rey_lib/artifacts/cli.py

# Architectural policy this repository asserts, declared as data. Only what the
# evidence model can prove is claimed here; see rey_lib_architecture_policy for
# the statements deliberately not asserted.
architecture_rules:
  # A proxy for one dimension of "owns no application business logic": it proves
  # the import relationship and nothing wider.
  - rule_id: shared_framework_imports_no_application
    forbidden_target_globs:
      - "rey_console*"
      - "rey_loader*"
      - "rey_analyzer*"
      - "file_operator*"
      - "trade_analyzer*"
      - "rey_messaging*"
      - "ftp_sync*"
      - "rey_db_admin*"
      - "pipeline_coordinator*"
    scope_path_globs:
      - "rey_lib/*"
    edge_kinds:
      - import
      - re_export
  # Forbids the direct logging API only. print() is deliberately absent: Python
  # logging is an event-recording system whose handlers route records to a
  # configured destination, while CLI output is a separate channel. The original
  # rule conflated them, and enforcing it would have moved a CLI tool's summary
  # off stdout.
  #
  # logging_setup wraps logging.getLogger, so it cannot route through itself.
  # That is the only exemption: this list names infrastructure owners and is not
  # a grandfather list for sites that have not been corrected.
  - rule_id: logging_routes_through_the_logging_owner
    forbidden_target_globs:
      - logging.getLogger
    allowed_path_globs:
      - "rey_lib/logs/logging_setup.py"
    scope_path_globs:
      - "rey_lib/*"
    edge_kinds:
      - call

# A written specifier only resolves to a file the inventory already contains.
module_extensions:
  - ".py"

module_index_files:
  - __init__.py
