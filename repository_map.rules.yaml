# App: rey_lib
# Purpose: Repository-map scan rules — inventory pruning, language mapping, file classification.
# Used-by: rey_lib.repository_map
#
# Shared application-neutral framework.
# Hidden entries are excluded by the scanner itself and are not listed here.
#
# This repository declares no architecture policy, so its generated map reports
# architecture_policy_status: not_configured. That is not the same as clean.

ignored_directory_names:
  - node_modules
  - __pycache__
  - build
  - dist
  - venv

ignored_path_globs:
  - "*.egg-info/*"
  - "*.zip"
  - "*.log"
  - "*.jsonl"

language_by_extension:
  ".py": Python
  ".yaml": YAML
  ".yml": YAML

generated_path_globs: []

vendor_path_globs: []

test_path_globs:
  - "tests/*"
  - "*/tests/*"
  - "test_*.py"
  - "*/test_*.py"

# Declared process entry points. This file is their owner: they are a
# repository-local declaration, not a copy of anything. Not added to make
# reachability look healthy.
runtime_entry_paths:
  - rey_lib/artifacts/cli.py

# Architectural policy this repository asserts, declared as data. Only what the
# evidence model can prove is claimed here; see rey_lib_architecture_policy for
# the statements deliberately not asserted.
architecture_rules:
  # A proxy for one dimension of "owns no application business logic": it proves
  # the import relationship and nothing wider.
  - rule_id: shared_framework_imports_no_application
    forbidden_target_globs:
      - "rey_console*"
      - "rey_loader*"
      - "rey_analyzer*"
      - "file_operator*"
      - "trade_analyzer*"
      - "rey_messaging*"
      - "ftp_sync*"
      - "rey_db_admin*"
      - "pipeline_coordinator*"
    scope_path_globs:
      - "rey_lib/*"
    edge_kinds:
      - import
      - re_export
  # Forbids the direct logging API only. print() is deliberately absent: Python
  # logging is an event-recording system whose handlers route records to a
  # configured destination, while CLI output is a separate channel. The original
  # rule conflated them, and enforcing it would have moved a CLI tool's summary
  # off stdout.
  #
  # logging_setup wraps logging.getLogger, so it cannot route through itself.
  # That is the only exemption: this list names infrastructure owners and is not
  # a grandfather list for sites that have not been corrected.
  - rule_id: logging_routes_through_the_logging_owner
    forbidden_target_globs:
      - logging.getLogger
    allowed_path_globs:
      - "rey_lib/logs/logging_setup.py"
    scope_path_globs:
      - "rey_lib/*"
    edge_kinds:
      - call

  # One execution, one run_id, minted once. rey_lib.run.identity is that site;
  # the logging layer consumes a run identity and does not decide one. A second
  # minting site is how a process handle and a durable record end up describing
  # one execution under two names, leaving a reader to correlate them by name
  # and start time.
  #
  # Scoped to the logging layer rather than to rey_lib, because uuid4 legitimately
  # produces error_id, message_id, operation_id, profile_id and approval_id
  # elsewhere. A rule wide enough to catch those would need seven exemptions,
  # which is the grandfather list the rule above refuses to be.
  #
  # execution_records mints failure_record_id — the identity of an error record,
  # not of a run. A different owner, not an uncorrected site.
  - rule_id: run_identity_has_one_owner
    forbidden_target_globs:
      - uuid.uuid4
    allowed_path_globs:
      - "rey_lib/logs/execution_records.py"
    scope_path_globs:
      - "rey_lib/logs/*"
    edge_kinds:
      - call

  # The layer chain runs Runner → rey_lib.run → rey_lib.logs → control_utils →
  # procedure map → DB adapter → database, and each layer expresses only its own
  # concern. rey_lib.run sits above rey_lib.logs, so logs reaching up into run
  # inverts the chain. The direction matters more than the call: identity is
  # established at the launch boundary and arrives on the context, rather than
  # being fetched from below at write time.
  - rule_id: logging_does_not_reach_up_into_run
    forbidden_target_globs:
      - "rey_lib.run"
      - "rey_lib.run.*"
      - "rey_lib/run/*"
    scope_path_globs:
      - "rey_lib/logs/*"
    edge_kinds:
      - import
      - re_export

  # The run/batch/step/event control routines are the DB half of run logging, so
  # rey_lib.logs is their only sanctioned caller: logs owns persistence
  # orchestration, control owns the database operations. The extra hop is the
  # architecture -- it is what localizes a future change of run store, and what
  # stops an app recording a run straight into the control database.
  #
  # Named routine by routine rather than as the whole of rey_lib.control, which
  # also owns artifacts, contracts, config snapshots and run_logged_sql. Those
  # are unrelated capabilities with their own legitimate callers, and a rule wide
  # enough to cover them would forbid uses this boundary has no opinion about.
  #
  # Scoped to rey_lib because this policy governs this repository. The same
  # prohibition on applications, the Runner, workflow and pipeline code is not
  # enforceable from here; it belongs in each repository's own rules.
  - rule_id: control_logging_is_reached_only_through_logs
    forbidden_target_globs:
      - "*control_utils.start_batch"
      - "*control_utils.end_batch"
      - "*control_utils.start_step"
      - "*control_utils.end_step"
      - "*control_utils.log_event"
    allowed_path_globs:
      - "rey_lib/logs/*"
    scope_path_globs:
      - "rey_lib/*"
    edge_kinds:
      - import
      - re_export
      - call

# A written specifier only resolves to a file the inventory already contains.
module_extensions:
  - ".py"

module_index_files:
  - __init__.py
